name: Build Pull Request

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ''
        type: string
      nats_server_version:
        description: NATS server version to build for tests
        required: false
        default: v2.14.3
        type: string

permissions: {}

concurrency:
  group: build-pr-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      nats_server_version: ${{ inputs.nats_server_version || 'v2.14.3' }}
      release_strategy: none
    secrets: inherit
