name: Build Merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ''
        type: string
      nats_server_version:
        description: NATS server version to build for tests
        required: false
        default: v2.14.3
        type: string

permissions: {}

concurrency:
  group: build-merge-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      nats_server_version: ${{ inputs.nats_server_version || 'v2.14.3' }}
      release_strategy: snapshot
    secrets: inherit

  publish-central:
    needs:
      - build
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-central.yml
    with:
      environment_name: maven-central-snapshot
      environment_url: https://central.sonatype.com/repository/maven-snapshots
    secrets: inherit

  publish-github-packages:
    needs:
      - build
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      environment_name: github-packages-snapshot
      environment_url: https://github.com/${{ github.repository }}/packages
    secrets: inherit
