name: 🔄 CD · Release Snapshot

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-dispatch-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "🛡️ Validate Dispatch Branch [${{ github.ref_name }}]"
        shell: sh
        run: |
          set -eu
          case "${GITHUB_REF_NAME}" in
            main|master)
              ;;
            *)
              echo "Release Snapshot workflow_dispatch must run from main or master, got: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

  build:
    needs:
      - validate-dispatch-ref
    if: ${{ always() && (needs.validate-dispatch-ref.result == 'success' || needs.validate-dispatch-ref.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ github.sha }}
      release_mode: snapshot

  publish-central:
    needs:
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/publish-central.yml
    with:
      build_output_timestamp: ${{ needs.build.outputs.build_output_timestamp }}
    secrets:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  publish-github-packages:
    needs:
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      build_output_timestamp: ${{ needs.build.outputs.build_output_timestamp }}
