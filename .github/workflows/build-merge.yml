name: Build Merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      nats_server_version:
        description: NATS server version to build for tests
        required: false
        default: v2.14.3
        type: string
      dry_run:
        description: Rehearse snapshot publishing without uploading externally
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: build-merge-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-dispatch-ref:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "🛡️ Validate Dispatch Branch [${{ github.ref_name }}]"
        shell: sh
        run: |
          set -eu
          case "${GITHUB_REF_NAME}" in
            main|master)
              ;;
            *)
              echo "Build Merge workflow_dispatch must run from main or master, got: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

  build:
    needs:
      - validate-dispatch-ref
    if: ${{ always() && (needs.validate-dispatch-ref.result == 'success' || needs.validate-dispatch-ref.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ github.sha }}
      nats_server_version: ${{ inputs.nats_server_version || 'v2.14.3' }}
      release_strategy: snapshot
    secrets: inherit

  publish-central:
    needs:
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/publish-central.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      environment_name: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'maven-central-snapshot-dry-run' || 'maven-central-snapshot' }}
      environment_url: https://central.sonatype.com/repository/maven-snapshots
    secrets: inherit

  publish-github-packages:
    needs:
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      environment_name: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'github-packages-snapshot-dry-run' || 'github-packages-snapshot' }}
      environment_url: https://github.com/${{ github.repository }}/packages
    secrets: inherit
