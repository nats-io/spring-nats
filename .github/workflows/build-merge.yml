name: Build Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      nats_server_version:
        description: NATS server version to build for tests
        required: false
        default: v2.14.3
        type: string
      publish_snapshot:
        description: Publish snapshot after verify
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: build-merge-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      nats_server_version: ${{ inputs.nats_server_version || 'v2.14.3' }}
      run_publish: ${{ github.event_name == 'push' || inputs.publish_snapshot }}
      upload_artifact: true
    secrets: inherit
