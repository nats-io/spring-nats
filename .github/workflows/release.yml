name: Release

on:
  workflow_dispatch:
    inputs:
      release_strategy:
        description: Release strategy to publish
        required: true
        default: patch
        type: choice
        options:
          - rc
          - patch
          - minor
          - major
      nats_server_version:
        description: NATS server version to build for tests
        required: false
        default: v2.14.3
        type: string
      dry_run:
        description: Rehearse release publishing without uploading or creating a GitHub release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ inputs.release_strategy }}-${{ github.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-dispatch-ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "🛡️ Validate Release Branch [${{ github.ref_name }}]"
        shell: sh
        run: |
          set -eu
          case "${GITHUB_REF_NAME}" in
            main|master)
              ;;
            *)
              echo "Release workflow_dispatch must run from main or master, got: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

  build:
    needs:
      - validate-dispatch-ref
    if: ${{ needs.validate-dispatch-ref.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ github.sha }}
      nats_server_version: ${{ inputs.nats_server_version || 'v2.14.3' }}
      release_strategy: ${{ inputs.release_strategy }}
    secrets: inherit

  publish-central:
    needs:
      - build
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/publish-central.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      environment_name: ${{ inputs.dry_run && 'maven-central-release-dry-run' || 'maven-central-release' }}
      environment_url: https://central.sonatype.com
    secrets: inherit

  publish-github-packages:
    needs:
      - build
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      environment_name: ${{ inputs.dry_run && 'github-packages-release-dry-run' || 'github-packages-release' }}
      environment_url: https://github.com/${{ github.repository }}/packages
    secrets: inherit

  create-release:
    needs:
      - build
      - publish-central
      - publish-github-packages
    if: needs.build.outputs.should_create_release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    environment:
      name: github-release
      url: ${{ steps.release_info.outputs.release_url || format('https://github.com/{0}/releases', github.repository) }}
    steps:
      - name: "🧑‍💻 Checkout [${{ needs.build.outputs.commit_sha }}]"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}

      - name: "🏷️ Create GitHub Release [${{ needs.build.outputs.resolved_version }}]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KIND: ${{ needs.build.outputs.release_kind }}
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
          TARGET_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: sh
        run: |
          set -eu
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "GitHub release already exists for ${RELEASE_VERSION}"
            exit 0
          fi

          if [ "${RELEASE_KIND}" = "prerelease" ]; then
            gh release create "${RELEASE_VERSION}" \
              --target "${TARGET_SHA}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${RELEASE_VERSION}" \
              --target "${TARGET_SHA}" \
              --generate-notes
          fi

      - name: "🔗 Read GitHub Release URL"
        id: release_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
        shell: sh
        run: |
          set -eu
          release_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" --jq '.html_url')
          printf 'release_url=%s\n' "${release_url}" >> "${GITHUB_OUTPUT}"
