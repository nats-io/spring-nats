name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to publish
        required: true
        type: string
      ref:
        description: Git ref to publish from
        required: false
        default: main
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_version || github.run_id }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  NATS_SERVER_VERSION: 'v2.14.3'

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Resolve release inputs
        id: release
        shell: sh
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.release_version }}'
            ref_name='${{ inputs.ref }}'
          else
            version='${{ github.event.release.tag_name }}'
            ref_name='${{ github.event.release.tag_name }}'
          fi
          version=${version#v}
          if [ -z "${version}" ]; then
            echo "Release version must not be empty" >&2
            exit 1
          fi
          case "${version}" in
            *-SNAPSHOT)
              echo "Release version must not end with -SNAPSHOT" >&2
              exit 1
              ;;
          esac
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'ref=%s\n' "${ref_name}" >> "${GITHUB_OUTPUT}"

      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Install nats-server
        uses: ./.github/actions/install-nats-server
        with:
          version: ${{ env.NATS_SERVER_VERSION }}

      - name: Set release version
        run: ./mvnw --no-transfer-progress versions:set -DnewVersion=${{ steps.release.outputs.version }} -DgenerateBackupPoms=false

      - name: Verify release build
        run: ./mvnw --no-transfer-progress verify

      - name: Publish release
        run: ./mvnw --no-transfer-progress -Ppublish -DskipTests deploy
