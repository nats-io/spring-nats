name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to publish
        required: true
        type: string
      ref:
        description: Git ref to publish from
        required: false
        default: main
        type: string
      nats_server_version:
        description: NATS server version to build for tests
        required: false
        default: v2.14.3
        type: string
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_version || github.run_id }}
  cancel-in-progress: false

jobs:
  publish-release:
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ inputs.ref || github.event.release.tag_name || 'main' }}
      nats_server_version: ${{ inputs.nats_server_version || 'v2.14.3' }}
      run_publish: true
      release_version: ${{ github.event.release.tag_name || inputs.release_version }}
      upload_artifact: true
    secrets: inherit
