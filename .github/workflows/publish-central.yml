name: Publish Central

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      nats_server_version:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      release_version:
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: "🔐 Check Publish Secrets"
        shell: sh
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -eu
          for name in OSSRH_USERNAME OSSRH_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "${value}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: "📥 Download Build Artifact [${{ inputs.artifact_name }}]"
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/build-artifacts

      - name: "🧑‍💻 Checkout [${{ inputs.ref }}]"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@main

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}

      - name: "📦 Clone NATS Server [${{ inputs.nats_server_version }}]"
        shell: sh
        run: |
          set -eu
          git clone --depth 1 --branch "${{ inputs.nats_server_version }}" \
            https://github.com/nats-io/nats-server.git "${RUNNER_TEMP}/nats-server-src"

      - name: "🔍 Read Go Info"
        id: go_info
        shell: sh
        run: |
          set -eu
          go_version=$(awk '/^toolchain / { sub(/^toolchain go/, "", $2); print $2; exit } /^go / && found != 1 { found = 1; print $2 }' \
            "${RUNNER_TEMP}/nats-server-src/go.mod")
          if [ -z "${go_version}" ]; then
            echo "Unable to determine Go version from NATS go.mod" >&2
            exit 1
          fi
          printf 'go_version=%s\n' "${go_version}" >> "${GITHUB_OUTPUT}"

      - name: "🐹 Setup Go [${{ steps.go_info.outputs.go_version }}]"
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_info.outputs.go_version }}
          cache-dependency-path: ${{ runner.temp }}/nats-server-src/go.mod

      - name: "♻️ Restore NATS Server Cache [${{ inputs.nats_server_version }}]"
        id: nats_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/nats-server/${{ inputs.nats_server_version }}
          key: nats-server-${{ runner.os }}-${{ runner.arch }}-${{ inputs.nats_server_version }}

      - name: "🔨 Build NATS Server [${{ inputs.nats_server_version }}]"
        if: steps.nats_cache.outputs.cache-hit != 'true'
        shell: sh
        run: |
          set -eu
          mkdir -p "${HOME}/.cache/nats-server/${{ inputs.nats_server_version }}"
          cd "${RUNNER_TEMP}/nats-server-src"
          go build -o "${HOME}/.cache/nats-server/${{ inputs.nats_server_version }}/nats-server" ./main.go

      - name: "📍 Expose NATS Server"
        shell: sh
        run: |
          set -eu
          chmod +x "${HOME}/.cache/nats-server/${{ inputs.nats_server_version }}/nats-server"
          printf '%s\n' "${HOME}/.cache/nats-server/${{ inputs.nats_server_version }}" >> "${GITHUB_PATH}"
          "${HOME}/.cache/nats-server/${{ inputs.nats_server_version }}/nats-server" -v

      - name: "🔖 Normalize Release Version"
        if: inputs.release_version != ''
        id: semver_info
        uses: YunaBraska/semver-info-action@main
        with:
          semver-a: ${{ inputs.release_version }}

      - name: "🚫 Reject Invalid Release Version"
        if: inputs.release_version != ''
        shell: sh
        run: |
          set -eu
          if [ "${{ steps.semver_info.outputs.is_valid_semver_a }}" != "true" ]; then
            echo "Invalid release version: ${{ inputs.release_version }}" >&2
            exit 1
          fi
          if [ "${{ steps.semver_info.outputs.is_stable_a }}" != "true" ]; then
            echo "Release version must be stable: ${{ inputs.release_version }}" >&2
            exit 1
          fi

      - name: "🏷️ Set Release Version [${{ steps.semver_info.outputs.clean_semver_a }}]"
        if: inputs.release_version != ''
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.semver_info.outputs.clean_semver_a }} -DgenerateBackupPoms=false

      - name: "🚀 Publish to Maven Central"
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: ./mvnw -B -Ppublish -DskipTests deploy
