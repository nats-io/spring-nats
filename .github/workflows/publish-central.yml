name: Publish Central

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
      environment_name:
        required: false
        default: maven-central
        type: string
      environment_url:
        required: false
        default: https://central.sonatype.com
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID containing the build-workspace artifact
        required: true
        type: string
      dry_run:
        description: Run packaging-only Central publish validation without uploading
        required: false
        default: false
        type: boolean
      environment_name:
        description: Deployment environment name
        required: false
        default: maven-central
        type: string
      environment_url:
        description: Deployment environment URL
        required: false
        default: https://central.sonatype.com
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    steps:
      - name: "🔐 Check Publish Secrets"
        if: inputs.dry_run != true
        shell: sh
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -eu
          : "${OSSRH_USERNAME:?Missing required secret: OSSRH_USERNAME}"
          : "${OSSRH_TOKEN:?Missing required secret: OSSRH_TOKEN}"
          : "${SIGNING_KEY:?Missing required secret: SIGNING_KEY}"
          : "${SIGNING_PASSWORD:?Missing required secret: SIGNING_PASSWORD}"

      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@v7
        with:
          name: build-workspace
          path: ${{ runner.temp }}/build-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "📦 Restore Build Workspace"
        shell: sh
        run: |
          set -eu
          tar -xzf "${RUNNER_TEMP}/build-artifact/build-workspace.tgz" -C "${GITHUB_WORKSPACE}"

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@3

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}

      - name: "🚀 Publish to Maven Central"
        shell: sh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -eu
          if [ "${DRY_RUN}" = "true" ]; then
            ./mvnw -B -Ppublish -DskipTests -Dgpg.skip=true -DskipPublishing=true package
          else
            ./mvnw -B -Ppublish -DskipTests deploy
          fi
