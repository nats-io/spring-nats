name: Publish Central

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      environment_name:
        required: false
        default: maven-central
        type: string
      environment_url:
        required: false
        default: https://central.sonatype.com
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID containing the build-workspace artifact
        required: true
        type: string
      environment_name:
        description: Deployment environment name
        required: false
        default: maven-central
        type: string
      environment_url:
        description: Deployment environment URL
        required: false
        default: https://central.sonatype.com
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    steps:
      - name: "🔐 Check Publish Secrets"
        shell: sh
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -eu
          for name in OSSRH_USERNAME OSSRH_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "${value}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: build-workspace
          path: ${{ runner.temp }}/build-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "📦 Restore Build Workspace"
        shell: sh
        run: |
          set -eu
          tar -xzf "${RUNNER_TEMP}/build-artifact/build-workspace.tgz" -C "${GITHUB_WORKSPACE}"

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@main

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}

      - name: "🚀 Publish to Maven Central"
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: ./mvnw -B -Ppublish -DskipTests deploy
