name: Publish GitHub Packages

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
      environment_name:
        required: false
        default: github-packages
        type: string
      environment_url:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID containing the build-workspace artifact
        required: true
        type: string
      dry_run:
        description: Deploy to a local file repository instead of GitHub Packages
        required: false
        default: false
        type: boolean
      environment_name:
        description: Deployment environment name
        required: false
        default: github-packages
        type: string
      environment_url:
        description: Deployment environment URL
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url || format('https://github.com/{0}/packages', github.repository) }}
    steps:
      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@v7
        with:
          name: build-workspace
          path: ${{ runner.temp }}/build-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "📦 Restore Build Workspace"
        shell: sh
        run: |
          set -eu
          tar -xzf "${RUNNER_TEMP}/build-artifact/build-workspace.tgz" -C "${GITHUB_WORKSPACE}"

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@3

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: "🚀 Publish to GitHub Packages"
        shell: sh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          if [ "${DRY_RUN}" = "true" ]; then
            repository="dry-run::file://${RUNNER_TEMP}/github-packages-dry-run"
          else
            repository="github::https://maven.pkg.github.com/${GITHUB_PACKAGES_REPOSITORY}"
          fi
          ./mvnw -B -DskipTests -Dmaven.javadoc.skip=false -DaltDeploymentRepository="${repository}" deploy
