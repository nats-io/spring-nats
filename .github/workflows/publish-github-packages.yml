name: Publish GitHub Packages

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID containing the build-workspace artifact
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: build-workspace
          path: ${{ runner.temp }}/build-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "📦 Restore Build Workspace"
        shell: sh
        run: |
          set -eu
          tar -xzf "${RUNNER_TEMP}/build-artifact/build-workspace.tgz" -C "${GITHUB_WORKSPACE}"

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@main

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: "🚀 Publish to GitHub Packages"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -DskipTests -Dmaven.javadoc.skip=false -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }} deploy
