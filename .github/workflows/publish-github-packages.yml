name: 📦 CD · Publish GitHub Packages

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      build_output_timestamp:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID
        required: true
        type: string
      build_output_timestamp:
        description: Build output timestamp
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    environment:
      name: github-packages
      url: ${{ format('https://github.com/{0}/packages', github.repository) }}
    steps:
      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-workspace
          path: ${{ github.workspace }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "🔧 Restore Maven Wrapper"
        shell: sh
        run: |
          set -eu
          chmod +x "${GITHUB_WORKSPACE}/mvnw"

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@7a178ff2b0222107efbaab0c457c2ff09a84a801 # 3.0.14

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: "🚀 Publish to GitHub Packages"
        shell: sh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_REPOSITORY: ${{ github.repository }}
          BUILD_OUTPUT_TIMESTAMP: ${{ inputs.build_output_timestamp }}
          MAVEN_COMMAND: ${{ steps.java_info.outputs.cmd }}
          PUBLISH_MODULES: nats-spring,nats-spring-boot-starter,nats-spring-cloud-stream-binder
        run: |
          set -eu
          repository="github::https://maven.pkg.github.com/${GITHUB_PACKAGES_REPOSITORY}"
          "${MAVEN_COMMAND}" -B -Dproject.build.outputTimestamp="${BUILD_OUTPUT_TIMESTAMP}" -pl "${PUBLISH_MODULES}" -am -DskipTests -DaltDeploymentRepository="${repository}" deploy
