name: Publish GitHub Packages

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release_version:
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: "📥 Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ runner.temp }}/build-artifacts

      - name: "🧑‍💻 Checkout [${{ inputs.ref }}]"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: "📦 Restore Build Targets"
        shell: sh
        run: |
          set -eu
          tar -xzf "${RUNNER_TEMP}/build-artifacts/build-artifacts.tgz" -C "${GITHUB_WORKSPACE}"

      - name: "🔍 Read Java Info"
        id: java_info
        uses: YunaBraska/java-info-action@main

      - name: "☕ Setup Java [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: "🔖 Normalize Release Version"
        if: inputs.release_version != ''
        id: semver_info
        uses: YunaBraska/semver-info-action@main
        with:
          semver-a: ${{ inputs.release_version }}

      - name: "🚫 Reject Invalid Release Version"
        if: inputs.release_version != ''
        shell: sh
        run: |
          set -eu
          if [ "${{ steps.semver_info.outputs.is_valid_semver_a }}" != "true" ]; then
            echo "Invalid release version: ${{ inputs.release_version }}" >&2
            exit 1
          fi
          if [ "${{ steps.semver_info.outputs.is_stable_a }}" != "true" ]; then
            echo "Release version must be stable: ${{ inputs.release_version }}" >&2
            exit 1
          fi

      - name: "🏷️ Set Release Version [${{ steps.semver_info.outputs.clean_semver_a }}]"
        if: inputs.release_version != ''
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.semver_info.outputs.clean_semver_a }} -DgenerateBackupPoms=false

      - name: "🚀 Publish to GitHub Packages"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -DskipTests -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }} deploy
