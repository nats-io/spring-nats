name: Install nats-server
description: Download and install a released nats-server binary on the GitHub runner
inputs:
  version:
    description: nats-server release version
    required: true
runs:
  using: composite
  steps:
    - name: Install nats-server
      shell: sh
      run: |
        set -eu
        case "$(uname -m)" in
          x86_64) arch='amd64' ;;
          aarch64|arm64) arch='arm64' ;;
          *)
            echo "Unsupported runner architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac
        archive="nats-server-${{ inputs.version }}-linux-${arch}.tar.gz"
        download_url="https://github.com/nats-io/nats-server/releases/download/${{ inputs.version }}/${archive}"
        work_dir="${RUNNER_TEMP}/nats-server"
        mkdir -p "${work_dir}" "${HOME}/.local/bin"
        curl -fsSL "${download_url}" -o "${work_dir}/${archive}"
        tar -xzf "${work_dir}/${archive}" -C "${work_dir}"
        install "${work_dir}/nats-server-${{ inputs.version }}-linux-${arch}/nats-server" "${HOME}/.local/bin/nats-server"
        printf '%s\n' "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        "${HOME}/.local/bin/nats-server" -v
